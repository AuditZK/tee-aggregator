name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: No account figures in comments
        run: bash scripts/check-comment-figures.sh

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./cmd/... ./internal/... ./pkg/...

      - name: Test
        run: go test ./internal/... ./pkg/... -count=1

      - name: Vulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  race:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The race detector is a C runtime: it needs cgo, and gcc ships with the runner.
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/... ./pkg/... -count=1 -timeout 20m
